<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Game</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #a2a4a8 ;
        }

        .game{
            width:1000px;
            height: 500px;
            border: 2px solid black;
            overflow: hidden;
            position: relative;
            background: linear-gradient(rgb(12, 65, 240) , white);

        }
        .world{
            position: absolute;
            width: 4000px;
            height: 100%;
            left: 0;
            top: 0;

        }
        .pipe pipe1{
            background-size: contain;
            left: 40px;
            position: absolute;


        }
        .ground{
            width: 100%;
            height: 70px;
            background-color: saddlebrown;
            position: absolute;
            bottom: 0;
            /* overflow: hidden; */

        }
        .player{
            height: 120px;
            width: 70px;
            left: 40px;
            bottom: 67px;
            position: absolute;
            background-repeat: no-repeat;
            background-position: bottom center;
            background-size:contain;
            background-image: url("assets/goku_idle_v2.gif");
            /* background-size: auto; */

        }
        .cloud{
            width: 100px;
            height: 60px;
            position: absolute;
        }
        .cloud1{
            top: 60px;
            left: 270px;
        }
        .cloud2{
            top : 125px;
            left : 600px;
        }

        .question{
            width: 50px;
            height: 50px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 37px;
            font-weight: bold;

            position: absolute;
            top:200px;

        }
        .q1{
            left: 100px;

        }
        .q2{
            left: 560px;
        }
        .q3{
            left: 870px;
        }

        .brick{
            width: 50px;
            height: 50px;
            background-color: saddlebrown;
            border: 2px solid black;
            top: 220px;
            position: absolute;
        }
        .b1{
            left: 390px;
        }
        .b2{
            left: 750px;
        }
        .pipe{
            width: 80px;
            position: absolute;
            bottom: 55px;
        }
        .pipe1{
            left: 300px;
        }
        .pipe2{
            left: 600px;
        }
        .pipe3{
            left: 900px;
        }
    </style>
</head>
<body>
    <div class="game">
        <div class="world">
            <!-- Clouds -->
             <div class="cloud cloud1"><img src="assets/nimbus_cloud.gif" alt="nimbus" height="60px" width="90px"></div>
             <div class="cloud cloud2"><img src="assets/nimbus_cloud.gif" alt="nimbus" height="60px" width="90px"></div>

             <!-- Blocks -->
              <div class="question q1"><img src="assets/dragonball_4star.gif" alt="powerup" height="60px" width="60px"></div>
              <div class="question q2"><img src="assets/dragonball_4star.gif" alt="powerup" height="60px" width="60px"></div>
              <div class="question q3"><img src="assets/dragonball_4star.gif" alt="powerup" height="60px" width="60px"></div>

              <!-- Brick -->
              <div class="brick b1"></div>
              <div class="brick b2"></div>

              <!-- Pipes -->
              <img src="assets/pipe.png" alt="pipe" class="pipe pipe1">
              <img src="assets/pipe.png" alt="pipe" class="pipe pipe2">
              <img src="assets/pipe.png" alt="pipe" class="pipe pipe3">

              <!-- Mushroom -->
               <img src="" alt="">
        </div>
        
        <!-- player -->
        <div class="player"></div>
        <!-- Ground -->
         <div class="ground"></div>
    </div>
    <script>
        const game = document.querySelector(".game");
        const world = document.querySelector(".world");
        const player = document.querySelector(".player");

        let playerX = 50;
        let playerY = 67;

        let velocity = 0;
        let gravity = 0.9;

        let isJumping = false;
        let moveLeft = false;
        let moveRight = false;

        function gameLoop() {
            if (moveRight) playerX += 8;
            if (moveLeft) playerX -= 8;

            velocity -= gravity;
            playerY += velocity;

            if (playerY <= 67) {
                playerY = 67;
                velocity = 0;

                if (isJumping) {
                    isJumping = false;
                    player.style.backgroundImage = (moveLeft || moveRight) 
                        ? 'url("assets/goku_run_transparent.gif")' 
                        : 'url("assets/goku_idle_v2.gif")';
                }
            }

            player.style.left = `${playerX}px`;
            player.style.bottom = `${playerY}px`;

            requestAnimationFrame(gameLoop);
        }

        window.addEventListener("keydown", function(e) {
            if (e.key === 'ArrowRight' || e.key === 'd') {
                moveRight = true;
                player.style.rotate = "none";
                if (!isJumping) {
                    player.style.backgroundImage = 'url("assets/goku_run_transparent.gif")';
                }
            }

            if (e.key === 'ArrowLeft' || e.key === 'a') {
                moveLeft = true;
                player.style.rotate = "y 180deg";
                if (!isJumping) {
                    player.style.backgroundImage = 'url("assets/goku_run_transparent.gif")';
                }
            }

            if ((e.key === " " || e.key === "ArrowUp" || e.key === "w") && !isJumping) {
                velocity = 18;
                isJumping = true;
                player.style.backgroundImage = `url("assets/goku_jump_punch.gif")`;
            }
        });

        window.addEventListener("keyup", function(e) {
            if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;

            if (!moveLeft && !moveRight && !isJumping) {
                player.style.backgroundImage = 'url("assets/goku_idle_v2.gif")';
            }
        });

        gameLoop();
    </script>
</body>
</html>
